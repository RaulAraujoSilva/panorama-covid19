<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panorama COVID-19</title>
<meta name="description" content="Dashboard interativo da pandemia de COVID-19: casos, óbitos, vacinação e restrições por país, com dados do Our World in Data até 5 de março de 2022.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232F6BD8'/%3E%3Cpath d='M5 24 L11 14 L16 19 L21 8 L27 16' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
  :root {
    color-scheme: light;
    --color-bg: #f6f7f9;
    --color-panel: #ffffff;
    --color-fg: #1b2230;
    --color-fg-muted: #5d6676;
    --color-border-line: #dfe3ea;
    --color-ok: #23804a;
    --color-warn: #a86a00;
    --color-bad: #c23b3b;
    --dash-c1: #2f6bd8; --dash-c2: #d1495b; --dash-c3: #2a9d8f; --dash-c4: #e09f3e;
    --dash-c5: #7b5ea7; --dash-c6: #3d9a50; --dash-c7: #c2577e; --dash-c8: #6b7a8f;
    --cds-chart-grid: #eceff4;
    --cds-chart-axis: #c5cbd6;
    --cds-chart-reference: #8a93a3;
    --cds-chart-muted: #8a93a3;
    --cds-surface-popover: #ffffff;
    --cds-border: #dfe3ea;
    --cds-shadow-popover: 0 6px 20px rgba(20, 30, 50, .12);
    --cds-text-secondary: #5d6676;
    --cds-skeleton: #e9ecf1;
    --font-anthropic-sans: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --font-anthropic-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --cds-font-size-caption: .8125rem;
    --cds-font-size-body: .9375rem;
    --cds-font-size-heading: 1.0625rem;
    --cds-font-size-title: 1.875rem;
    --cds-font-weight-medium: 600;
    --cds-radius: 8px;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 14px; --cds-gap-lg: 22px; --cds-gap-xl: 32px;
    --cds-pad-xs: 6px; --cds-pad-sm: 10px; --cds-pad-md: 14px; --cds-pad-lg: 18px; --cds-pad-xl: 28px;
    --cds-dur-slow: 400ms;
    --cds-ease-out: cubic-bezier(.2, .7, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --color-bg: #0f141c;
      --color-panel: #171e29;
      --color-fg: #e6eaf1;
      --color-fg-muted: #9aa4b5;
      --color-border-line: #2a3342;
      --color-ok: #5cc98a;
      --color-warn: #e8b04f;
      --color-bad: #f07272;
      --dash-c1: #6f9bf0; --dash-c2: #ef7a88; --dash-c3: #4fc1b2; --dash-c4: #f2b866;
      --dash-c5: #a68bd1; --dash-c6: #6cc27e; --dash-c7: #e085a6; --dash-c8: #9aa8ba;
      --cds-chart-grid: #222b38;
      --cds-chart-axis: #3a4556;
      --cds-chart-reference: #7d889a;
      --cds-chart-muted: #7d889a;
      --cds-surface-popover: #1e2734;
      --cds-border: #2f3a4b;
      --cds-shadow-popover: 0 8px 24px rgba(0, 0, 0, .45);
      --cds-text-secondary: #9aa4b5;
      --cds-skeleton: #212a37;
    }
  }
  html, body { margin: 0; }
  body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: 15px; }
  #dash-root {
    max-width: 1320px; margin-inline: auto;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .dash-skeleton { position: relative; }
  .dash-skeleton::after {
    content: ""; position: absolute; inset: 0; border-radius: var(--cds-radius); background: var(--cds-skeleton);
  }
  @media (prefers-reduced-motion: no-preference) {
    .dash-skeleton::after { animation: dash-pulse 1.4s ease-in-out infinite; }
    @keyframes dash-pulse { 50% { opacity: .55; } }
  }
  .cv-brush .overlay { cursor: crosshair; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="dash-shim.js"></script>
</head>
<body>
<main id="dash-root">
{{CONTEUDO}}
</main>
</body>
</html>
